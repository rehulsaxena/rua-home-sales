<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUA HOME Sales prototype</title><style>body{font:16px system-ui;background:#f4f5f7;color:#17252a;margin:0}header{background:#153d39;color:white;padding:20px}main{max-width:600px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:12px;margin-bottom:14px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bbb;border-radius:8px}button{background:#153d39;color:white;margin-top:12px;border:0}small{color:#555} .warn{color:#a54a00}article{padding:10px 0;border-bottom:1px solid #ddd}</style><header><b>RUA HOME / SALES</b><div>Order booking prototype</div></header><main><section><b>Demo only — no live OTP or customer data</b><p>Use fictional customer information. Catalogue supplied by ruahome.in. Storefront prices are references. Wholesale rates and OTP are simulated.</p><label>Sales executive</label><select id="staff"></select><label>Retail shop</label><input id="shop" placeholder="Demo shop"><label>Owner mobile</label><input id="phone" inputmode="numeric" placeholder="10-digit demo number"><label>Customer pricing tier</label><select id="tier"><option value="0">Standard</option><option value="10">Preferred (₹10 off per unit)</option></select></section><section><b>Product catalogue</b><label for="search">Find a product</label><input id="search" type="search" placeholder="Search name or SKU"><p id="catalogueStatus" role="status"></p><div id="products"></div><button id="add" disabled>Add selected product</button><select id="product"></select><label>Quantity (pieces)</label><input id="qty" type="number" min="1" value="1"></section><section><b>Order summary</b><div id="cart"></div><p id="total"></p><button id="send">Generate demo OTP</button><div id="otpArea" hidden><p id="hint"></p><input id="otp" inputmode="numeric" placeholder="Enter demo OTP"><button id="confirm">Confirm demo order</button></div><p id="status" role="status"></p></section><section><b>Confirmed orders (this session)</b><div id="orders"></div></section></main><script>
const $=id=>document.getElementById(id), products=new Map();let cart=[],pending=null,orders=[],staffList=[],loggedInStaff=null;const money=n=>'₹'+n.toFixed(2);async function loadProducts() {
  const status = $('catalogueStatus');
  status.textContent = 'Loading the storefront catalogue…';
  let items, offline = false;
  try {
    const response = await fetch('/api/catalogue');
    if (!response.ok) throw new Error('Catalogue unavailable');
    items = await response.json();
    localStorage.setItem('rua_catalogue', JSON.stringify(items));
  } catch {
    const cached = localStorage.getItem('rua_catalogue');
    if (!cached) { status.textContent = 'WooCommerce catalogue unavailable. Order entry is paused.'; return; }
    items = JSON.parse(cached);
    offline = true;
  }
  for (const p of items) {
      const price = p.price === '' || p.price == null ? null : Number(p.price);
      const stock = p.stock_status === 'outofstock' ? 0 : p.stock_quantity;
      const article = document.createElement('article');
      article.dataset.search = [p.name, p.sku, ...(p.categories ?? []).map(category => category.name ?? category)].join(' ').toLowerCase();
      if (p.image) { const img = document.createElement('img'); img.src = p.image; img.alt = ''; img.loading = 'lazy'; img.style.cssText = 'width:48px;height:48px;object-fit:cover;border-radius:6px;margin-right:10px;vertical-align:middle'; article.append(img); }
const text = document.createElement('span');
      text.textContent = p.name + ' • SKU ' + (p.sku || '—') +
        ' • Website price ' + (price == null ? 'unavailable' : money(price)) +
        ' • ' + (stock === 0 ? 'Out of stock' : stock == null ? 'Quantity unavailable' : 'Stock: ' + stock);
      article.append(text);
      $('products').append(article);
      if (price == null || !Number.isFinite(price) || price < 0) continue;
      products.set(p.id, { ...p, price, stock });
      $('product').add(new Option(p.name, p.id));
    }
    $('add').disabled = products.size === 0;
    status.textContent = items.length + ' products and variants ' + (offline ? 'loaded from offline cache.' : 'loaded from WooCommerce.');
}
  
loadProducts();

  async function sha256hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const staffPassword = document.createElement('input');
  staffPassword.type = 'password';
  staffPassword.placeholder = 'Staff password';
  staffPassword.id = 'staffPassword';
  const staffLoginBtn = document.createElement('button');
  staffLoginBtn.type = 'button';
  staffLoginBtn.textContent = 'Log in';
  const staffLoginStatus = document.createElement('p');
  staffLoginStatus.setAttribute('role', 'status');
  $('staff').after(staffPassword, staffLoginBtn, staffLoginStatus);

  async function loadStaff() {
    try {
      const response = await fetch('/api/staff');
      if (!response.ok) throw new Error('staff fetch failed');
      staffList = await response.json();
      localStorage.setItem('rua_staff', JSON.stringify(staffList));
    } catch {
      staffList = JSON.parse(localStorage.getItem('rua_staff') || '[]');
    }
    $('staff').replaceChildren();
    for (const s of staffList) $('staff').add(new Option(s.name, s.id));
  }
  loadStaff();

  staffLoginBtn.onclick = async () => {
    const staff = staffList.find(s => s.id === Number($('staff').value));
    if (!staff) { staffLoginStatus.textContent = 'No staff selected'; return; }
    const pwHash = await sha256hex(staffPassword.value);
    if (pwHash !== staff.passwordHash) { staffLoginStatus.textContent = 'Incorrect password'; return; }
    loggedInStaff = staff;
    staffLoginStatus.textContent = 'Logged in as ' + staff.name;
    $('staff').disabled = true;
    staffPassword.disabled = true;
    staffLoginBtn.disabled = true;
  };
  
$('search').oninput = () => {
  const query = $('search').value.trim().toLowerCase();
  for (const article of $('products').children) article.hidden = !article.dataset.search.includes(query);
  for (const option of $('product').options) {
    const product = products.get(Number(option.value));
    option.hidden = ![product.name, product.sku, ...(product.categories ?? []).map(category => category.name ?? category)].join(' ').toLowerCase().includes(query);
  }
  const firstMatch = Array.from($('product').options).find(option => !option.hidden);
  $('product').value = firstMatch?.value ?? '';
  $('add').disabled = !firstMatch;
};
function invalidate(){pending=null;$('otpArea').hidden=true;$('status').textContent='';}
  function lines(){return cart.map(c=>{let p=products.get(c.id),rate=Math.max(0,Math.round(p.price*100)-Number($('tier').value)*100-(c.qty>=24?1500:0));return {...c,name:p.name,rate:rate/100,stock:p.stock,pool:p.stock_pool??p.id,parentId:p.parent_id??null,total:rate*c.qty/100}})}
  function render(){invalidate();$('cart').replaceChildren();for(const l of lines()){let a=document.createElement('article');a.textContent=l.name+' × '+l.qty+' @ '+money(l.rate)+' = '+money(l.total);if(l.stock==null||lines().filter(item=>item.pool===l.pool).reduce((qty,item)=>qty+item.qty,0)>l.stock){let w=document.createElement('p');w.className='warn';w.textContent=l.stock==null?'Stock warning: quantity unavailable':'Stock warning: only '+l.stock+' available across the selected options';a.append(w)}let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{cart=cart.filter(c=>c.id!==l.id);render()};a.append(b);$('cart').append(a)}$('total').textContent='Subtotal (tax not configured): '+money(lines().reduce((s,l)=>s+l.total,0))}
  $('add').onclick=()=>{let id=Number($('product').value),qty=Number($('qty').value);if(!products.has(id)||!Number.isSafeInteger(qty)||qty<1||qty>100000)return alert('Enter a valid quantity');let c=cart.find(c=>c.id===id);if(c)c.qty+=qty;else cart.push({id,qty});render()};
  $('tier').onchange=render;
  for(const id of ['shop','phone'])$(id).oninput=invalidate;

  function queueOfflineOrder(order){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    queue.push(order);
    localStorage.setItem('rua_pending_orders', JSON.stringify(queue));
    renderPendingSync();
  }

  function renderPendingSync(){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    let box = document.getElementById('pendingSync');
    if (!box) {
      box = document.createElement('section');
      box.id = 'pendingSync';
      const heading = document.createElement('b');
      heading.textContent = 'Pending sync (offline orders)';
      box.append(heading);
      $('orders').closest('section').before(box);
    }
    box.querySelectorAll('article').forEach(a => a.remove());
    queue.forEach((order, index) => {
      const a = document.createElement('article');
      a.textContent = order.shop + ' ' + money(order.lines.reduce((s,l)=>s+l.total,0)) + ' waiting to sync';
      const b = document.createElement('button');
      b.textContent = 'Retry sync';
      b.onclick = () => retrySync(index);
      a.append(b);
      box.append(a);
    });
  }

  async function retrySync(index){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    const order = queue[index];
    if (!order) return;
    try {
      const response = await fetch('/api/otp/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: order.phone, lines: order.lines }) });
      if (!response.ok) throw new Error('offline');
      queue.splice(index, 1);
      localStorage.setItem('rua_pending_orders', JSON.stringify(queue));
      renderPendingSync();
      pending = order;
      $('hint').textContent = 'Enter the OTP sent to the customer to confirm this order';
      $('otp').value = '';
      $('otpArea').hidden = false;
    } catch {
      alert('Still offline. Try again once connected.');
    }
  }
  renderPendingSync();

  $('send').onclick = async () => {
    if (!loggedInStaff) return alert('Log in first');
    if (!cart.length || !$('shop').value.trim() || !/^\d{10}$/.test($('phone').value)) return alert('Enter shop, 10-digit customer mobile and products');
    const order = { shop: $('shop').value, phone: $('phone').value, staffId: loggedInStaff.id, staffName: loggedInStaff.name, lines: lines() };
    try {
      const response = await fetch('/api/otp/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: order.phone, lines: order.lines }) });
      if (!response.ok) throw new Error('send failed');
      pending = order;
      $('hint').textContent = 'OTP sent to the customer mobile';
      $('otp').value = '';
      $('otpArea').hidden = false;
      $('status').textContent = '';
    } catch {
      queueOfflineOrder(order);
      $('status').textContent = 'No connection. Order queued and will sync once online.';
    }
  };

  $('confirm').onclick = async () => {
    if (!pending) return;
    try {
      const response = await fetch('/api/otp/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: pending.phone, code: $('otp').value }) });
      const result = await response.json();
      if (!response.ok || !result.ok) { $('status').textContent = 'Incorrect or expired OTP'; return; }
      const saved = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pending) });
      const savedOrder = await saved.json();
      orders.push(pending);
      let a = document.createElement('article');
      a.textContent = (savedOrder.orderNumber || ('RH-' + orders.length)) + ' ' + pending.shop + ' ' + pending.staffName + ' ' + money(pending.lines.reduce((s,l)=>s+l.total,0));
      $('orders').prepend(a);
      cart = [];
      render();
$('status').textContent = 'Order confirmed' + (savedOrder.warning ? ' (' + savedOrder.warning + ')' : '');
    } catch {
      $('status').textContent = 'Could not reach the server to confirm. Try again once connected.';
    }
  };

  render();</script></html>
