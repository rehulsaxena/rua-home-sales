<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUA HOME Sales prototype</title><style>body{font:16px system-ui;background:#f4f5f7;color:#17252a;margin:0}header{background:#153d39;color:white;padding:20px}main{max-width:600px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:12px;margin-bottom:14px}label{display:block;margin:12px 0 4px}input,select,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #bbb;border-radius:8px}button{background:#153d39;color:white;margin-top:12px;border:0}small{color:#555} .warn{color:#a54a00;font-weight:bold} .ok{color:#146c2e;font-weight:bold}article{padding:10px 0;border-bottom:1px solid #ddd}</style><header><b>RUA HOME / SALES</b><div>Order booking prototype</div></header><main><section><b>Demo only &#8212; no live OTP or customer data</b><p>Use fictional customer information. Catalogue supplied by ruahome.in. Storefront prices are references. Wholesale rates and OTP are simulated.</p><label>Sales executive</label><select id="staff"></select><label>Retail shop</label><input id="shop" placeholder="Demo shop"><label>Owner mobile</label><input id="phone" inputmode="numeric" placeholder="10-digit demo number"><label>Customer pricing tier</label><select id="tier"><option value="0">Standard</option><option value="10">Preferred (\u20B910 off per unit)</option></select></section><section><b>Product catalogue</b><label for="categoryFilter">Category</label><select id="categoryFilter"><option value="">All categories</option></select><label for="search">Find a product</label><input id="search" type="search" placeholder="Search name or SKU"><p id="catalogueStatus" role="status"></p><div id="products"></div></section><section><b>Order summary</b><div id="cart"></div><p id="total"></p><button id="send">Generate demo OTP</button><div id="otpArea" hidden><p id="hint"></p><input id="otp" inputmode="numeric" placeholder="Enter demo OTP"><button id="confirm">Confirm demo order</button></div><p id="status" role="status"></p></section><section><b>Confirmed orders (this session)</b><div id="orders"></div></section></main><script>
const $=id=>document.getElementById(id), products=new Map(), catalogueRows=new Map();let cart=[],pending=null,orders=[],staffList=[],loggedInStaff=null;const money=n=>'\u20B9'+n.toFixed(2);function tierDiscount(){return Number($('tier').value)||0;}
function refreshPrices(){
  for (const row of catalogueRows.values()) {
    const net = Math.max(0, row.price - tierDiscount());
    row.el.textContent = row.name + ' \u2022 Price ' + money(net) +
      ' \u2022 ' + (row.stock === 0 ? 'Out of stock' : row.stock == null ? 'Quantity unavailable' : 'Stock: ' + row.stock);
  }
}
function addToCart(id, qtyInput) {
  const qty = Number(qtyInput.value);
  if (!products.has(id) || !Number.isSafeInteger(qty) || qty < 1 || qty > 100000) return alert('Enter a valid quantity');
  const existing = cart.find(c => c.id === id);
  if (existing) existing.qty += qty; else cart.push({ id, qty });
  qtyInput.value = 1;
  render();
}

function filterProducts() {
  const query = $('search').value.trim().toLowerCase();
  const category = $('categoryFilter').value.toLowerCase();
  for (const article of $('products').children) {
    const matchesSearch = article.dataset.search.includes(query);
    const matchesCategory = !category || article.dataset.categories.split('|').includes(category);
    article.hidden = !(matchesSearch && matchesCategory);
  }
}

async function loadProducts() {
  const status = $('catalogueStatus');
  status.textContent = 'Loading the storefront catalogue\u2026';
  let items, offline = false;
  try {
    const response = await fetch('/api/catalogue');
    if (!response.ok) throw new Error('Catalogue unavailable');
    items = await response.json();
    localStorage.setItem('rua_catalogue', JSON.stringify(items));
  } catch {
    const cached = localStorage.getItem('rua_catalogue');
    if (!cached) { status.textContent = 'WooCommerce catalogue unavailable. Order entry is paused.'; return; }
    items = JSON.parse(cached);
    offline = true;
  }
  const categories = new Map();
  for (const p of items) {
      const price = p.price === '' || p.price == null ? null : Number(p.price);
      const stock = p.stock_status === 'outofstock' ? 0 : p.stock_quantity;
      const categoryNames = (p.categories ?? []).map(category => category.name ?? category);
      for (const name of categoryNames) categories.set(name.toLowerCase(), name);
      const article = document.createElement('article');
      article.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap';
      article.dataset.search = [p.name, p.sku, ...categoryNames].join(' ').toLowerCase();
      article.dataset.categories = categoryNames.join('|').toLowerCase();
      if (p.image) { const img = document.createElement('img'); img.src = p.image; img.alt = ''; img.loading = 'lazy'; img.style.cssText = 'width:48px;height:48px;object-fit:cover;border-radius:6px;flex:none'; article.append(img); }
      const text = document.createElement('span');
      text.style.cssText = 'flex:1;min-width:160px';
      const available = price != null && Number.isFinite(price) && price >= 0 && stock !== 0;
      article.append(text);
      if (available) {
        products.set(p.id, { ...p, price, stock });
        catalogueRows.set(p.id, { name: p.name, price, stock, el: text });
        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.min = '1';
        qtyInput.value = '1';
        qtyInput.style.cssText = 'width:70px;flex:none';
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.textContent = 'Add';
        addBtn.style.cssText = 'width:auto;margin-top:0;flex:none';
        addBtn.onclick = () => addToCart(p.id, qtyInput);
        article.append(qtyInput, addBtn);
      } else {
        text.textContent = p.name + ' \u2022 Price unavailable \u2022 ' + (stock === 0 ? 'Out of stock' : 'Quantity unavailable');
      }
      $('products').append(article);
    }
    refreshPrices();
    for (const [value, label] of [...categories].sort((a, b) => a[1].localeCompare(b[1]))) {
      $('categoryFilter').add(new Option(label, value));
    }
    status.textContent = items.length + ' products and variants ' + (offline ? 'loaded from offline cache.' : 'loaded from WooCommerce.');
}
  
loadProducts();

  async function sha256hex(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const staffPassword = document.createElement('input');
  staffPassword.type = 'password';
  staffPassword.placeholder = 'Staff password';
  staffPassword.id = 'staffPassword';
  const staffLoginBtn = document.createElement('button');
  staffLoginBtn.type = 'button';
  staffLoginBtn.textContent = 'Log in';
  const staffLoginStatus = document.createElement('p');
  staffLoginStatus.setAttribute('role', 'status');
  staffLoginStatus.id = 'staffLoginStatus';
  staffLoginStatus.style.margin = '10px 0';
  const staffLogoutBtn = document.createElement('button');
  staffLogoutBtn.type = 'button';
  staffLogoutBtn.textContent = 'Log out';
  staffLogoutBtn.id = 'staffLogoutBtn';
  staffLogoutBtn.hidden = true;
  staffLogoutBtn.style.background = '#a54a00';
  $('staff').after(staffPassword, staffLoginBtn, staffLoginStatus, staffLogoutBtn);

  async function loadStaff() {
    try {
      const response = await fetch('/api/staff');
      if (!response.ok) throw new Error('staff fetch failed');
      staffList = await response.json();
      localStorage.setItem('rua_staff', JSON.stringify(staffList));
    } catch {
      staffList = JSON.parse(localStorage.getItem('rua_staff') || '[]');
    }
    $('staff').replaceChildren();
    for (const s of staffList) $('staff').add(new Option(s.name, s.id));
  }
  loadStaff();

  staffLoginBtn.onclick = async () => {
    const staff = staffList.find(s => s.id === Number($('staff').value));
    if (!staff) { staffLoginStatus.textContent = 'No staff selected'; staffLoginStatus.className = 'warn'; return; }
    if (!staffPassword.value) { staffLoginStatus.textContent = 'Enter the staff password'; staffLoginStatus.className = 'warn'; return; }
    staffLoginStatus.textContent = 'Checking\u2026';
    staffLoginStatus.className = '';
    const pwHash = await sha256hex(staffPassword.value);
    if (pwHash !== staff.passwordHash) { staffLoginStatus.textContent = '\u2717 Incorrect password'; staffLoginStatus.className = 'warn'; return; }
    loggedInStaff = staff;
    staffLoginStatus.textContent = '\u2713 Logged in as ' + staff.name;
    staffLoginStatus.className = 'ok';
    $('staff').disabled = true;
    staffPassword.disabled = true;
    staffLoginBtn.disabled = true;
    staffLoginBtn.textContent = 'Logged in';
    staffLoginBtn.hidden = true;
    staffLogoutBtn.hidden = false;
  };

  staffLogoutBtn.onclick = () => {
    loggedInStaff = null;
    staffPassword.value = '';
    staffLoginStatus.textContent = 'Logged out';
    staffLoginStatus.className = '';
    $('staff').disabled = false;
    staffPassword.disabled = false;
    staffLoginBtn.disabled = false;
    staffLoginBtn.textContent = 'Log in';
    staffLoginBtn.hidden = false;
    staffLogoutBtn.hidden = true;
  };
  
$('search').oninput = filterProducts;
$('categoryFilter').onchange = filterProducts;
function invalidate(){pending=null;$('otpArea').hidden=true;$('status').textContent='';}
  function lines(){return cart.map(c=>{let p=products.get(c.id),rate=Math.max(0,Math.round(p.price*100)-Number($('tier').value)*100-(c.qty>=24?1500:0));return {...c,name:p.name,rate:rate/100,stock:p.stock,pool:p.stock_pool??p.id,parentId:p.parent_id??null,total:rate*c.qty/100}})}
  function render(){invalidate();$('cart').replaceChildren();for(const l of lines()){let a=document.createElement('article');a.textContent=l.name+' \u00D7 '+l.qty+' @ '+money(l.rate)+' = '+money(l.total);if(l.stock==null||lines().filter(item=>item.pool===l.pool).reduce((qty,item)=>qty+item.qty,0)>l.stock){let w=document.createElement('p');w.className='warn';w.textContent=l.stock==null?'Stock warning: quantity unavailable':'Stock warning: only '+l.stock+' available across the selected options';a.append(w)}let b=document.createElement('button');b.textContent='Remove';b.onclick=()=>{cart=cart.filter(c=>c.id!==l.id);render()};a.append(b);$('cart').append(a)}$('total').textContent='Subtotal (tax not configured): '+money(lines().reduce((s,l)=>s+l.total,0))}
  $('tier').onchange=()=>{refreshPrices();render();};
  for(const id of ['shop','phone'])$(id).oninput=invalidate;

  function queueOfflineOrder(order){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    queue.push(order);
    localStorage.setItem('rua_pending_orders', JSON.stringify(queue));
    renderPendingSync();
  }

  function renderPendingSync(){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    let box = document.getElementById('pendingSync');
    if (!box) {
      box = document.createElement('section');
      box.id = 'pendingSync';
      const heading = document.createElement('b');
      heading.textContent = 'Pending sync (offline orders)';
      box.append(heading);
      $('orders').closest('section').before(box);
    }
    box.querySelectorAll('article').forEach(a => a.remove());
    queue.forEach((order, index) => {
      const a = document.createElement('article');
      a.textContent = order.shop + ' ' + money(order.lines.reduce((s,l)=>s+l.total,0)) + ' waiting to sync';
      const b = document.createElement('button');
      b.textContent = 'Retry sync';
      b.onclick = () => retrySync(index);
      a.append(b);
      box.append(a);
    });
  }

  async function retrySync(index){
    const queue = JSON.parse(localStorage.getItem('rua_pending_orders') || '[]');
    const order = queue[index];
    if (!order) return;
    try {
      const response = await fetch('/api/otp/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: order.phone, lines: order.lines }) });
      if (!response.ok) throw new Error('offline');
      queue.splice(index, 1);
      localStorage.setItem('rua_pending_orders', JSON.stringify(queue));
      renderPendingSync();
      pending = order;
      $('hint').textContent = 'Enter the OTP sent to the customer to confirm this order';
      $('otp').value = '';
      $('otpArea').hidden = false;
    } catch {
      alert('Still offline. Try again once connected.');
    }
  }
  renderPendingSync();

  $('send').onclick = async () => {
    if (!loggedInStaff) return alert('Log in first');
    if (!cart.length || !$('shop').value.trim() || !/^\d{10}$/.test($('phone').value)) return alert('Enter shop, 10-digit customer mobile and products');
    const order = { shop: $('shop').value, phone: $('phone').value, staffId: loggedInStaff.id, staffName: loggedInStaff.name, lines: lines() };
    try {
      const response = await fetch('/api/otp/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: order.phone, lines: order.lines }) });
      if (!response.ok) throw new Error('send failed');
      pending = order;
      $('hint').textContent = 'OTP sent to the customer mobile';
      $('otp').value = '';
      $('otpArea').hidden = false;
      $('status').textContent = '';
    } catch {
      queueOfflineOrder(order);
      $('status').textContent = 'No connection. Order queued and will sync once online.';
    }
  };

  $('confirm').onclick = async () => {
    if (!pending) return;
    try {
      const response = await fetch('/api/otp/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: pending.phone, code: $('otp').value }) });
      const result = await response.json();
      if (!response.ok || !result.ok) { $('status').textContent = 'Incorrect or expired OTP'; return; }
      const saved = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pending) });
      const savedOrder = await saved.json();
      orders.push(pending);
      let a = document.createElement('article');
      a.textContent = (savedOrder.orderNumber || ('RH-' + orders.length)) + ' ' + pending.shop + ' ' + pending.staffName + ' ' + money(pending.lines.reduce((s,l)=>s+l.total,0));
      $('orders').prepend(a);
      cart = [];
      render();
$('status').textContent = 'Order confirmed' + (savedOrder.warning ? ' (' + savedOrder.warning + ')' : '');
    } catch {
      $('status').textContent = 'Could not reach the server to confirm. Try again once connected.';
    }
  };

  render();</script></html>
