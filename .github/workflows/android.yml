name: Build Android APK
on: {workflow_dispatch: null, push: {branches: [main], paths: ["android-app/**", ".github/workflows/android.yml"]}}
jobs: {build: {runs-on: ubuntu-latest, defaults: {run: {working-directory: "android-app"}}, env: {RELEASE_KEYSTORE_BASE64: "${{ secrets.RELEASE_KEYSTORE_BASE64 }}", RELEASE_STORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}", RELEASE_KEY_ALIAS: "${{ secrets.RELEASE_KEY_ALIAS }}", RELEASE_STORE_FILE: "release.keystore"}, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-node@v4", with: {node-version: 22}}, {name: "Install JS dependencies", run: "npm install"}, {name: "Generate native Android project from Capacitor", run: "npx cap add android\nnpx cap sync android"}, {name: "Generate custom app icon", run: "if [ -f assets/rua-home-logo-source.png ]; then\n  sudo apt-get update -y >/dev/null 2>&1 || true\n  sudo apt-get install -y imagemagick >/dev/null 2>&1 || true\n  convert assets/rua-home-logo-source.png -gravity center -background white -resize 760x760 -extent 1024x1024 assets/icon.png\n  npx --yes @capacitor/assets generate --android\nelse\n  echo 'No committed logo at android-app/assets/rua-home-logo-source.png yet - keeping the default Capacitor icon.'\nfi"}, {name: "Install native HTTP Basic Auth login prompt", run: "cp native/MainActivity.java android/app/src/main/java/in/ruahome/sales/MainActivity.java"}, {name: "Install stable debug signing keystore", run: "mkdir -p ~/.android\nbase64 -d signing/debug-keystore.base64 > ~/.android/debug.keystore"}, {name: "Pin a widely-available SDK level", run: "sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle\nsed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle"}, {uses: "actions/setup-java@v4", with: {distribution: "temurin", java-version: "21"}}, {name: "Install Android SDK platform and build-tools", run: "SDK_BASE=\"${ANDROID_HOME:-$ANDROID_SDK_ROOT}\"\nSDKMANAGER=$(find \"$SDK_BASE\" -maxdepth 6 -type f -iname sdkmanager 2>/dev/null | head -1)\necho Using sdkmanager at: $SDKMANAGER\nif [ -z \"$SDKMANAGER\" ]; then echo 'sdkmanager not found, aborting'; exit 1; fi\nyes | \"$SDKMANAGER\" --licenses || true\n\"$SDKMANAGER\" \"platform-tools\" \"platforms;android-36\" \"build-tools;36.0.0\""}, {name: "Build debug APK", working-directory: "android-app/android", run: "chmod +x gradlew\n./gradlew assembleDebug --no-daemon"}, {uses: "actions/upload-artifact@v4", with: {name: "rua-home-sales-debug-apk", path: "android-app/android/app/build/outputs/apk/debug/app-debug.apk"}}, {name: "Install release signing keystore", if: "${{ env.RELEASE_KEYSTORE_BASE64 != '' }}", run: "echo \"$RELEASE_KEYSTORE_BASE64\" | tr -d '[:space:]' | base64 -d > android/app/release.keystore"}, {name: "Configure release signing", if: "${{ env.RELEASE_KEYSTORE_BASE64 != '' }}", run: "cat >> android/app/build.gradle << 'EOF'\nandroid {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv(\"RELEASE_STORE_FILE\"))\n            storePassword System.getenv(\"RELEASE_STORE_PASSWORD\")\n            keyAlias System.getenv(\"RELEASE_KEY_ALIAS\")\n            keyPassword System.getenv(\"RELEASE_STORE_PASSWORD\")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }\n    }\n}\nEOF"}, {name: "Build release APK", if: "${{ env.RELEASE_KEYSTORE_BASE64 != '' }}", working-directory: "android-app/android", run: "chmod +x gradlew\n./gradlew assembleRelease --no-daemon"}, {uses: "actions/upload-artifact@v4", if: "${{ env.RELEASE_KEYSTORE_BASE64 != '' }}", with: {name: "rua-home-sales-release-apk", path: "android-app/android/app/build/outputs/apk/release/app-release.apk"}}]}}
