name: Build Android APK
on: {workflow_dispatch: null, push: {branches: [main], paths: ["android-app/**", ".github/workflows/android.yml"]}}
jobs: {build: {runs-on: ubuntu-latest, defaults: {run: {working-directory: "android-app"}}, steps: [{uses: "actions/checkout@v4"}, {uses: "actions/setup-node@v4", with: {node-version: 22}}, {name: "Install JS dependencies", run: "npm install"}, {name: "Generate native Android project from Capacitor", run: "npx cap add android\nnpx cap sync android"}, {name: "Pin a widely-available SDK level", run: "sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle\nsed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle"}, {uses: "actions/setup-java@v4", with: {distribution: "temurin", java-version: "21"}}, {name: "Install Android SDK platform and build-tools", run: "SDKMANAGER=$(find \"${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools\" -maxdepth 2 -name sdkmanager | head -1)\necho Using sdkmanager at: $SDKMANAGER\nyes | \"$SDKMANAGER\" --licenses || true\n\"$SDKMANAGER\" \"platform-tools\" \"platforms;android-34\" \"build-tools;34.0.0\""}, {name: "Build debug APK", working-directory: "android-app/android", run: "chmod +x gradlew\n./gradlew assembleDebug --no-daemon"}, {uses: "actions/upload-artifact@v4", with: {name: "rua-home-sales-debug-apk", path: "android-app/android/app/build/outputs/apk/debug/app-debug.apk"}}]}}
